services:
  backend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5013:5010"
    env_file:
      - "./.env"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npx prisma generate && npm run start:dev"

volumes:
  node_modules:
