name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Hostinger
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            # Load NVM
            export NVM_DIR="/root/.nvm"
            source "$NVM_DIR/nvm.sh"

            # Use Node.js 24
            nvm use 24

            echo "Node: $(node -v)"
            echo "NPM: $(npm -v)"
            echo "NPX: $(npx -v)"
            echo "PM2: $(pm2 -v)"

            # Go to project
            cd ${{ secrets.VPS_APP_PATH }}

            # Pull latest code
            git pull origin main

            # Install dependencies
            npm ci

            # Generate Prisma Client
            npx prisma generate

            # Build application
            npm run build

            # Restart application
            pm2 reload ecosystem.config.cjs --env development --update-env

            # Save PM2 process list
            pm2 save