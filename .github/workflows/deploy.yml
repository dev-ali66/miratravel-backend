name: MiraTravel Backend CI/CD

on:
  push:
    branches:
      - main

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}

jobs:
  build:
    name: Build MiraTravel Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Create deployment package
        run: |
          zip -r backend-build.zip \
            dist \
            node_modules \
            prisma \
            package.json \
            package-lock.json \
            ecosystem.config.cjs

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend-build.zip
          retention-days: 1

  deploy:
    name: Deploy to Hostinger
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: backend-build

      - name: Create backend directory on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}

          script: |
            set -e

            echo "=== Creating backend directory ==="

            mkdir -p "${{ env.VPS_APP_PATH }}"

            echo "Backend path:"
            echo "${{ env.VPS_APP_PATH }}"

      - name: Copy package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          source: "backend-build.zip"
          target: ${{ env.VPS_APP_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}

          script: |
            set -e

            echo "Node: $(node -v)"
            echo "NPM: $(npm -v)"
            echo "PM2: $(pm2 -v)"

            cd "${{ env.VPS_APP_PATH }}"

            echo "=== Extracting deployment package ==="
            unzip -o backend-build.zip

            echo "=== Removing deployment package ==="
            rm -f backend-build.zip

            echo "=== Reloading PM2 ==="
            pm2 reload ecosystem.config.cjs --update-env --env development || \
            pm2 start ecosystem.config.cjs --env development

            echo "=== Saving PM2 process list ==="
            pm2 save

            echo "=== Deployment completed successfully ==="

      - name: Delete deployment artifact from GitHub Actions
        uses: geekyeggo/delete-artifact@v5
        if: always()
        with:
          name: backend-build